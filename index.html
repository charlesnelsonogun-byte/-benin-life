<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Benin Life 🇳🇬</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#101010;
  font-family:Arial,sans-serif;
  color:white;
  touch-action:none;
}
#game{
  position:relative;
  width:100%;
  height:100%;
  aspect-ratio:16/9;
  margin:auto;
  overflow:hidden;
  background:#777;
}
canvas{
  display:block;
  width:100%;
  height:100%;
}
#hud{
  position:absolute;
  top:12px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
}
.panel{
  background:rgba(10,15,20,.82);
  border:1px solid rgba(255,255,255,.15);
  border-radius:12px;
  padding:10px 13px;
  backdrop-filter:blur(5px);
}
#stats{
  min-width:180px;
}
#money{
  color:#ffd45a;
  font-size:20px;
  font-weight:bold;
}
.small{
  font-size:12px;
  opacity:.75;
}
#location{
  font-weight:bold;
}
#message{
  position:absolute;
  left:50%;
  bottom:16%;
  transform:translateX(-50%);
  width:min(440px,88%);
  text-align:center;
  background:rgba(8,12,18,.9);
  padding:12px;
  border-radius:12px;
  display:none;
}
#chat{
  position:absolute;
  right:12px;
  bottom:90px;
  width:250px;
  max-height:180px;
  overflow:hidden;
  background:rgba(8,12,18,.82);
  border-radius:12px;
  padding:10px;
  font-size:12px;
}
.chatLine{
  padding:5px 0;
  border-bottom:1px solid rgba(255,255,255,.08);
}
#controls{
  position:absolute;
  bottom:15px;
  left:15px;
  right:15px;
  display:flex;
  justify-content:space-between;
  align-items:end;
  pointer-events:none;
}
#joystick{
  width:125px;
  height:125px;
  border-radius:50%;
  background:rgba(255,255,255,.12);
  border:2px solid rgba(255,255,255,.2);
  position:relative;
  pointer-events:auto;
}
#stick{
  width:50px;
  height:50px;
  border-radius:50%;
  background:rgba(255,255,255,.45);
  position:absolute;
  left:37px;
  top:37px;
}
.actions{
  display:grid;
  grid-template-columns:repeat(2,65px);
  gap:8px;
  pointer-events:auto;
}
.actions button{
  width:65px;
  height:52px;
  border:0;
  border-radius:12px;
  background:rgba(10,15,20,.86);
  color:white;
  font-weight:bold;
}
.actions button:active{
  transform:scale(.95);
  background:#c99127;
}
#start{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(#111827,#20170c);
  z-index:20;
}
.startBox{
  width:min(420px,90%);
  background:#111923;
  border:1px solid #354457;
  border-radius:20px;
  padding:25px;
  text-align:center;
}
.startBox h1{
  font-size:38px;
  margin:0 0 5px;
}
.startBox p{
  opacity:.7;
}
input{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid #39485a;
  background:#080d14;
  color:white;
  margin:12px 0;
}
.startBtn{
  width:100%;
  padding:15px;
  border:0;
  border-radius:11px;
  background:#e5a52f;
  font-weight:bold;
}
#mission{
  margin-top:12px;
  padding:10px;
  border-radius:10px;
  background:#182332;
  font-size:12px;
}
@media(max-width:700px){
  #chat{display:none}
  #stats{min-width:145px}
  #money{font-size:17px}
  .panel{padding:8px 10px}
}
</style>
</head>

<body>

<div id="game">

<canvas id="scene"></canvas>

<div id="start">
  <div class="startBox">
    <h1>🇳🇬 BENIN LIFE</h1>
    <p>Your life. Your choices. Your Benin.</p>

    <input id="nameInput"
           maxlength="20"
           placeholder="Enter your character name">

    <button class="startBtn" id="startBtn">
      ENTER BENIN CITY 🚀
    </button>

    <div id="mission">
      Explore the city, meet NPCs, work, eat,
      travel and build your life.
    </div>
  </div>
</div>

<div id="hud">
  <div class="panel" id="stats">
    <div id="playerName">Player</div>
    <div id="location">Ugbowo</div>
    <div id="money">₦15,000</div>
    <div class="small">
      ❤️ <span id="health">100</span>
      &nbsp; ⚡ <span id="energy">100</span>
    </div>
  </div>

  <div class="panel">
    <div id="clock">08:00</div>
    <div class="small">DAY <span id="day">1</span></div>
  </div>
</div>

<div id="message"></div>

<div id="chat"></div>

<div id="controls">

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <div class="actions">
    <button id="talk">💬</button>
    <button id="work">💼</button>
    <button id="eat">🍛</button>
    <button id="car">🚗</button>
    <button id="run">🏃</button>
    <button id="map">🗺️</button>
  </div>

</div>

</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

/* =====================================================
   BENIN LIFE — LOW GRAPHICS 3D WEB GAME
===================================================== */

const canvas=document.getElementById("scene");

const renderer=new THREE.WebGLRenderer({
  canvas,
  antialias:false,
  powerPreference:"high-performance"
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio,1.25)
);

renderer.setSize(
  canvas.clientWidth,
  canvas.clientHeight,
  false
);

renderer.shadowMap.enabled=false;

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x87a9c7);

const camera=new THREE.PerspectiveCamera(
  55,
  16/9,
  .1,
  700
);

camera.position.set(0,8,12);


/* =====================================================
   GAME STATE
===================================================== */

let started=false;

const player={
  name:"Player",
  money:15000,
  health:100,
  energy:100,
  happiness:70,
  day:1,
  hour:8,
  location:"Ugbowo",
  job:"Student",
  walking:true,
  inCar:false,
  speed:0.09,
  reputation:0
};


/* =====================================================
   LIGHTING
===================================================== */

const hemi=new THREE.HemisphereLight(
  0xffffff,
  0x45513a,
  1.8
);

scene.add(hemi);

const sun=new THREE.DirectionalLight(
  0xffffff,
  1.5
);

sun.position.set(80,100,40);
scene.add(sun);


/* =====================================================
   WORLD
===================================================== */

const world=new THREE.Group();
scene.add(world);

const ground=new THREE.Mesh(
  new THREE.PlaneGeometry(500,500),
  new THREE.MeshLambertMaterial({
    color:0x5d7652
  })
);

ground.rotation.x=-Math.PI/2;
world.add(ground);


/* =====================================================
   ROAD CREATOR
===================================================== */

function road(x,z,w,d){

  const r=new THREE.Mesh(
    new THREE.BoxGeometry(w,.05,d),
    new THREE.MeshLambertMaterial({
      color:0x30343a
    })
  );

  r.position.set(x,.03,z);
  world.add(r);

  return r;
}


/* MAIN ROADS */

road(0,0,28,500);
road(0,0,500,28);
road(80,80,25,300);
road(-90,-80,25,300);


/* ROAD LINES */

function roadLine(x,z,w,d){

  const line=new THREE.Mesh(
    new THREE.BoxGeometry(w,.06,d),
    new THREE.MeshBasicMaterial({
      color:0xf1d36a
    })
  );

  line.position.set(x,.07,z);
  world.add(line);
}

for(let i=-220;i<220;i+=20){

  roadLine(0,i,.35,8);
  roadLine(i,0,8,.35);

}


/* =====================================================
   BUILDINGS
===================================================== */

function building(x,z,w,h,d,color,name){

  const group=new THREE.Group();

  const body=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    new THREE.MeshLambertMaterial({
      color
    })
  );

  body.position.y=h/2;
  group.add(body);

  const roof=new THREE.Mesh(
    new THREE.BoxGeometry(
      w+1,
      .5,
      d+1
    ),
    new THREE.MeshLambertMaterial({
      color:0x303030
    })
  );

  roof.position.y=h+.25;
  group.add(roof);

  group.position.set(x,0,z);

  group.userData.name=name;

  world.add(group);

  return group;
}


/* BENIN CITY AREAS */

building(-45,-45,20,8,20,0xc49a6c,"Shop");
building(45,-45,22,12,20,0xd6d0bf,"Office");
building(-45,45,25,10,20,0xb97954,"Market");
building(45,45,20,7,20,0xc4c7b7,"Restaurant");

building(-120,40,35,14,25,0x9d6d4d,"New Benin Market");
building(120,-40,30,16,25,0xb8b0a1,"GRA House");
building(110,110,30,10,25,0x8f6d4e,"Airport Hotel");
building(-120,-110,35,13,25,0xa7896c,"Ugbowo Shops");


/* =====================================================
   OBA PALACE
===================================================== */

const palace=new THREE.Group();

const palaceBase=new THREE.Mesh(
  new THREE.BoxGeometry(42,4,28),
  new THREE.MeshLambertMaterial({
    color:0x9b3c24
  })
);

palaceBase.position.y=2;
palace.add(palaceBase);

const palaceRoof=new THREE.Mesh(
  new THREE.ConeGeometry(24,10,4),
  new THREE.MeshLambertMaterial({
    color:0x6e1712
  })
);

palaceRoof.position.y=9;
palaceRoof.rotation.y=Math.PI/4;
palace.add(palaceRoof);

for(let x=-15;x<=15;x+=10){

  const pillar=new THREE.Mesh(
    new THREE.CylinderGeometry(
      1.3,1.3,9,8
    ),
    new THREE.MeshLambertMaterial({
      color:0xc69b4a
    })
  );

  pillar.position.set(x,4.5,15);
  palace.add(pillar);
}

palace.position.set(0,0,-100);

world.add(palace);


/* PALACE SIGN */

function label(text,x,y,z){

  const c=document.createElement("canvas");
  c.width=512;
  c.height=128;

  const ctx=c.getContext("2d");

  ctx.fillStyle="rgba(0,0,0,.75)";
  ctx.fillRect(0,0,512,128);

  ctx.fillStyle="white";
  ctx.font="bold 42px Arial";
  ctx.textAlign="center";
  ctx.fillText(text,256,78);

  const texture=new THREE.CanvasTexture(c);

  const sprite=new THREE.Sprite(
    new THREE.SpriteMaterial({
      map:texture,
      transparent:true
    })
  );

  sprite.scale.set(14,3.5,1);
  sprite.position.set(x,y,z);

  world.add(sprite);
}

label(
  "👑 OBA'S PALACE",
  0,
  14,
  -100
);

label(
  "UGBOWO",
  -45,
  15,
  -45
);

label(
  "RING ROAD",
  70,
  12,
  0
);


/* =====================================================
   PLAYER
===================================================== */

const playerGroup=new THREE.Group();

const body=new THREE.Mesh(
  new THREE.CapsuleGeometry(
    .45,1.2,4,8
  ),
  new THREE.MeshLambertMaterial({
    color:0x202a38
  })
);

body.position.y=1.3;
playerGroup.add(body);

const head=new THREE.Mesh(
  new THREE.SphereGeometry(.43,8,8),
  new THREE.MeshLambertMaterial({
    color:0x8d5a3b
  })
);

head.position.y=2.35;
playerGroup.add(head);

playerGroup.position.set(0,0,20);

scene.add(playerGroup);


/* =====================================================
   NPCs
===================================================== */

const npcs=[];

const npcNames=[
  "Osaro",
  "Efe",
  "Ivie",
  "Amaka",
  "Omoregie",
  "Eghosa",
  "Eseosa",
  "Lucky",
  "Tony",
  "Queen"
];

function createNPC(i){

  const npc=new THREE.Group();

  const shirtColors=[
    0x34495e,
    0x7d3325,
    0x4d6b3a,
    0x7a5c28,
    0x5c3d70
  ];

  const torso=new THREE.Mesh(
    new THREE.BoxGeometry(.7,1.1,.45),
    new THREE.MeshLambertMaterial({
      color:shirtColors[i%shirtColors.length]
    })
  );

  torso.position.y=1;
  npc.add(torso);

  const head=new THREE.Mesh(
    new THREE.SphereGeometry(.35,7,7),
    new THREE.MeshLambertMaterial({
      color:0x875538
    })
  );

  head.position.y=1.8;
  npc.add(head);

  const angle=Math.random()*Math.PI*2;
  const radius=20+Math.random()*90;

  npc.position.set(
    Math.cos(angle)*radius,
    0,
    Math.sin(angle)*radius
  );

  npc.userData={
    name:npcNames[i%npcNames.length],
    targetX:(Math.random()-.5)*180,
    targetZ:(Math.random()-.5)*180,
    speed:.015+Math.random()*.025,
    job:[
      "Shopkeeper",
      "Student",
      "Driver",
      "Vendor",
      "Worker",
      "Police Officer"
    ][i%6]
  };

  world.add(npc);
  npcs.push(npc);
}

for(let i=0;i<32;i++){
  createNPC(i);
}


/* =====================================================
   VEHICLES
===================================================== */

const vehicles=[];

function createVehicle(type,x,z,dir){

  const v=new THREE.Group();

  let color=0xffffff;

  if(type==="bus"){
    color=dir%2===0?0xb32626:0xe0b52c;
  }

  if(type==="police"){
    color=0xdfe7ee;
  }

  if(type==="taxi"){
    color=0xe1b83b;
  }

  const base=new THREE.Mesh(
    new THREE.BoxGeometry(
      type==="bus"?3.2:2.2,
      1,
      type==="bus"?7:4
    ),
    new THREE.MeshLambertMaterial({
      color
    })
  );

  base.position.y=.8;
  v.add(base);

  const top=new THREE.Mesh(
    new THREE.BoxGeometry(
      type==="bus"?2.7:1.8,
      .9,
      type==="bus"?4.5:2
    ),
    new THREE.MeshLambertMaterial({
      color:0x253342
    })
  );

  top.position.y=1.55;
  v.add(top);

  if(type==="police"){

    const light=new THREE.Mesh(
      new THREE.BoxGeometry(1,.2,.5),
      new THREE.MeshBasicMaterial({
        color:0xff2222
      })
    );

    light.position.y=2.1;
    v.add(light);
  }

  v.position.set(x,0,z);

  v.userData={
    type,
    direction:dir%2===0?1:-1,
    speed:type==="bus"?.07:.11
  };

  world.add(v);
  vehicles.push(v);
}


/* RED/YELLOW BUSES */

for(let i=0;i<5;i++){

  createVehicle(
    "bus",
    -200+i*80,
    -12,
    i
  );

  createVehicle(
    "bus",
    12,
    -200+i*80,
    i
  );
}


/* TAXIS */

for(let i=0;i<7;i++){

  createVehicle(
    "taxi",
    -170+i*55,
    13,
    i
  );
}


/* POLICE */

for(let i=0;i<4;i++){

  createVehicle(
    "police",
    -100+i*65,
    10,
    i
  );
}


/* =====================================================
   TREES
===================================================== */

function tree(x,z){

  const g=new THREE.Group();

  const trunk=new THREE.Mesh(
    new THREE.CylinderGeometry(.25,.35,2.5,6),
    new THREE.MeshLambertMaterial({
      color:0x5a3925
    })
  );

  trunk.position.y=1.25;
  g.add(trunk);

  const leaves=new THREE.Mesh(
    new THREE.SphereGeometry(
      2.2,
      7,
      7
    ),
    new THREE.MeshLambertMaterial({
      color:0x37643b
    })
  );

  leaves.position.y=3.2;
  g.add(leaves);

  g.position.set(x,0,z);

  world.add(g);
}

for(let i=0;i<70;i++){

  const x=(Math.random()-.5)*420;
  const z=(Math.random()-.5)*420;

  if(Math.abs(x)<20 || Math.abs(z)<20) continue;

  tree(x,z);
}


/* =====================================================
   JOYSTICK
===================================================== */

let joyX=0;
let joyY=0;

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let joyActive=false;

function moveJoystick(clientX,clientY){

  const r=joystick.getBoundingClientRect();

  let x=clientX-(r.left+r.width/2);
  let y=clientY-(r.top+r.height/2);

  const max=43;

  const len=Math.sqrt(x*x+y*y);

  if(len>max){
    x=x/len*max;
    y=y/len*max;
  }

  joyX=x/max;
  joyY=y/max;

  stick.style.left=(37+x)+"px";
  stick.style.top=(37+y)+"px";
}

joystick.addEventListener(
  "pointerdown",
  e=>{
    joyActive=true;
    joystick.setPointerCapture(e.pointerId);
    moveJoystick(e.clientX,e.clientY);
  }
);

joystick.addEventListener(
  "pointermove",
  e=>{
    if(joyActive)
      moveJoystick(e.clientX,e.clientY);
  }
);

joystick.addEventListener(
  "pointerup",
  ()=>{
    joyActive=false;
    joyX=0;
    joyY=0;
    stick.style.left="37px";
    stick.style.top="37px";
  }
);


/* =====================================================
   CAMERA / MOVEMENT
===================================================== */

let running=false;

function updatePlayer(){

  if(!started)return;

  const multiplier=running?1.8:1;

  const dx=joyX*player.speed*multiplier;
  const dz=joyY*player.speed*multiplier;

  playerGroup.position.x+=dx;
  playerGroup.position.z+=dz;

  player.energy-=
    (Math.abs(dx)+Math.abs(dz))*.05;

  player.energy=Math.max(
    0,
    Math.min(100,player.energy)
  );

  if(Math.abs(dx)+Math.abs(dz)>.001){

    playerGroup.rotation.y=
      Math.atan2(dx,dz);
  }

  /* WORLD BOUNDS */

  playerGroup.position.x=
    Math.max(-220,
      Math.min(220,
        playerGroup.position.x
      )
    );

  playerGroup.position.z=
    Math.max(-220,
      Math.min(220,
        playerGroup.position.z
      )
    );


  /* CAMERA */

  const target=new THREE.Vector3(
    playerGroup.position.x,
    1.5,
    playerGroup.position.z
  );

  const behind=new THREE.Vector3(
    playerGroup.position.x,
    7,
    playerGroup.position.z+11
  );

  camera.position.lerp(
    behind,
    .08
  );

  camera.lookAt(target);

  updateLocation();
}


/* =====================================================
   LOCATION SYSTEM
===================================================== */

function updateLocation(){

  const x=playerGroup.position.x;
  const z=playerGroup.position.z;

  let loc="Benin City";

  if(Math.abs(x)<55 && Math.abs(z)<55)
    loc="Ugbowo";

  if(x>55 && x<130 && Math.abs(z)<55)
    loc="Ring Road";

  if(x<-55 && z<0)
    loc="New Benin";

  if(x>70 && z<0)
    loc="GRA";

  if(x>70 && z>60)
    loc="Airport Road";

  if(x<-60 && z>40)
    loc="Ekewan";

  if(Math.abs(z+100)<35 && Math.abs(x)<40)
    loc="Oba's Palace";

  player.location=loc;

  document.getElementById(
    "location"
  ).textContent="📍 "+loc;
}


/* =====================================================
   NPC MOVEMENT
===================================================== */

function updateNPCs(){

  for(const npc of npcs){

    const dx=
      npc.userData.targetX-
      npc.position.x;

    const dz=
      npc.userData.targetZ-
      npc.position.z;

    const dist=Math.sqrt(
      dx*dx+dz*dz
    );

    if(dist<3){

      npc.userData.targetX=
        (Math.random()-.5)*190;

      npc.userData.targetZ=
        (Math.random()-.5)*190;

      continue;
    }

    npc.position.x+=
      dx/dist*npc.userData.speed;

    npc.position.z+=
      dz/dist*npc.userData.speed;

    npc.rotation.y=
      Math.atan2(dx,dz);
  }
}


/* =====================================================
   VEHICLE MOVEMENT
===================================================== */

function updateVehicles(){

  for(const v of vehicles){

    if(v.userData.type==="bus" ||
       v.userData.type==="taxi" ||
       v.userData.type==="police"){

      v.position.x+=
        v.userData.speed*
        v.userData.direction;

      if(v.position.x>240)
        v.position.x=-240;

      if(v.position.x<-240)
        v.position.x=240;
    }
  }
}


/* =====================================================
   TIME
===================================================== */

let timeCounter=0;

function updateTime(){

  timeCounter++;

  if(timeCounter%900!==0)
    return;

  player.hour++;

  if(player.hour>=24){

    player.hour=0;
    player.day++;

    player.money+=
      player.job==="Student"?0:5000;

    player.energy=100;

    addChat(
      "CITY",
      "A new day begins in Benin City 🌅"
    );
  }

  const h=
    String(player.hour).padStart(2,"0");

  document.getElementById(
    "clock"
  ).textContent=h+":00";

  document.getElementById(
    "day"
  ).textContent=player.day;

  updateLighting();
}


/* =====================================================
   DAY / NIGHT
===================================================== */

function updateLighting(){

  const h=player.hour;

  if(h>=19 || h<6){

    scene.background.set(0x101827);

    hemi.intensity=.45;
    sun.intensity=.35;

  }else{

    scene.background.set(0x87a9c7);

    hemi.intensity=1.8;
    sun.intensity=1.5;
  }
}


/* =====================================================
   CHAT
===================================================== */

const chat=document.getElementById("chat");

function addChat(name,text){

  const line=document.createElement("div");

  line.className="chatLine";

  line.innerHTML=
    "<b>"+name+":</b> "+text;

  chat.prepend(line);

  while(chat.children.length>7)
    chat.removeChild(
      chat.lastChild
    );
}


/* RANDOM NPC CHAT */

const cityMessages=[
  "Omo, traffic today 😂",
  "How far?",
  "You dey go where?",
  "This weather is hot o!",
  "I dey find food.",
  "Business must move today.",
  "You see that bus?",
  "Benin City no dull."
];

setInterval(()=>{

  if(!started)return;

  const npc=
    npcs[
      Math.floor(
        Math.random()*npcs.length
      )
    ];

  addChat(
    npc.userData.name,
    cityMessages[
      Math.floor(
        Math.random()*cityMessages.length
      )
    ]
  );

},6000);


/* =====================================================
   ACTIONS
===================================================== */

function showMessage(text){

  const box=
    document.getElementById("message");

  box.textContent=text;
  box.style.display="block";

  clearTimeout(window.msgTimer);

  window.msgTimer=setTimeout(
    ()=>{
      box.style.display="none";
    },
    2500
  );
}


/* TALK */

document.getElementById(
  "talk"
).addEventListener("click",()=>{

  let nearest=null;
  let nearestDist=999;

  for(const npc of npcs){

    const d=
      npc.position.distanceTo(
        playerGroup.position
      );

    if(d<nearestDist){

      nearest=npc;
      nearestDist=d;
    }
  }

  if(nearest && nearestDist<8){

    const replies=[
      "How far? 👋",
      "You be new here?",
      "I dey work around here.",
      "Nice to meet you!",
      "You wan explore Benin?",
      "This area busy today."
    ];

    const reply=
      replies[
        Math.floor(
          Math.random()*replies.length
        )
      ];

    addChat(
      nearest.userData.name,
      reply
    );

    player.happiness=
      Math.min(
        100,
        player.happiness+2
      );

  }else{

    showMessage(
      "No NPC close enough to talk to."
    );
  }
});


/* WORK */

document.getElementById(
  "work"
).addEventListener("click",()=>{

  if(player.energy<15){

    showMessage(
      "You're too tired to work."
    );

    return;
  }

  const earned=
    player.job==="Student"
      ? 3000
      : 8000;

  player.money+=earned;
  player.energy-=15;
  player.reputation+=1;

  showMessage(
    "You worked and earned ₦"+
    earned.toLocaleString()+" 💼"
  );
});


/* FOOD */

document.getElementById(
  "eat"
).addEventListener("click",()=>{

  if(player.money<1500){

    showMessage(
      "You need ₦1,500 for food."
    );

    return;
  }

  player.money-=1500;

  player.energy=
    Math.min(100,
      player.energy+18
    );

  player.health=
    Math.min(100,
      player.health+4
    );

  player.happiness=
    Math.min(100,
      player.happiness+5
    );

  showMessage(
    "You ate some good food 🍛"
  );
});


/* CAR */

document.getElementById(
  "car"
).addEventListener("click",()=>{

  if(player.money<350000){

    showMessage(
      "You need ₦350,000 to buy a vehicle."
    );

    return;
  }

  player.money-=350000;
  player.inCar=true;
  player.speed=.16;

  showMessage(
    "You bought a vehicle 🚗"
  );
});


/* RUN */

/* =====================================================
   START
===================================================== */

document.getElementById(
  "startBtn"
).addEventListener("click",()=>{

  const name=
    document.getElementById(
      "nameInput"
    ).value.trim();

  player.name=
    name||"Player";

  document.getElementById(
    "playerName"
  ).textContent=
    "👤 "+player.name;

  document.getElementById(
    "start"
  ).style.display="none";

  started=true;

  addChat(
    "CITY",
    "Welcome to Benin City, "+
    player.name+" 🇳🇬"
  );

  showMessage(
    "Welcome to Benin Life! Explore the city 🚀"
  );
});


/* =====================================================
   HUD
===================================================== */

function updateHUD(){

  document.getElementById(
    "money"
  ).textContent=
    "₦"+
    Math.round(
      player.money
    ).toLocaleString();

  document.getElementById(
    "health"
  ).textContent=
    Math.round(player.health);

  document.getElementById(
    "energy"
  ).textContent=
    Math.round(player.energy);
}


/* =====================================================
   RESIZE
===================================================== */

function resize(){

  const width=window.innerWidth;
  const height=window.innerHeight;

  renderer.setSize(
    width,
    height,
    false
  );

  camera.aspect=
    width/height;

  camera.updateProjectionMatrix();
}

window.addEventListener(
  "resize",
  resize
);

resize();


/* =====================================================
   GAME LOOP
===================================================== */

function animate(){

  requestAnimationFrame(animate);

  updatePlayer();
  updateNPCs();
  updateVehicles();
  updateTime();
  updateHUD();

  renderer.render(
    scene,
    camera
  );
}

animate();

</script>
